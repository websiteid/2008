<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zee App | Dashboard Premium</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-pink: #ff4d6d;
            --secondary-pink: #ff758c;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100vh;
            width: 100%;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* Latar Belakang & Overlay */
        .full-bg { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -2; 
            object-fit: cover; 
            background-color: #1e293b;
        }
        
        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.6)); 
            z-index: -1; 
        }

        /* Tata Letak Utama */
        .app-layout {
            position: relative;
            width: 90%;
            max-width: 400px;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0 30px;
            z-index: 10;
            perspective: 1000px; /* Diperlukan untuk efek parallax tilt */
        }

        /* Notifikasi Akses Ditolak */
        #login-notif {
            position: absolute;
            top: 20px;
            width: 100%;
            z-index: 9999;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 15px 20px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            visibility: hidden;
        }

        .stiker-bear { width: 45px; height: 45px; flex-shrink: 0; }

        /* Card Dashboard */
        .glass-card-premium {
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 40px;
            padding: 3rem 1.5rem 2.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            margin-top: auto;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out; /* Untuk efek Parallax */
        }

        .glass-card-premium::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
            transform: rotate(30deg);
            pointer-events: none;
        }

        /* Profil Avatar */
        .avatar-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, var(--primary-pink), #fac1d1, var(--secondary-pink));
            background-size: 200% 200%;
            animation: gradientRotate 4s ease infinite;
            position: relative;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            background: #f8fafc;
            transition: opacity 0.5s;
        }

        /* FITUR BARU: Status Indicator Glow */
        .status-glow {
            position: absolute;
            bottom: 5px;
            right: 8px;
            width: 20px;
            height: 20px;
            background-color: #10b981;
            border: 3px solid white;
            border-radius: 50%;
            z-index: 10;
            opacity: 0; /* Hidden saat loading */
            transition: opacity 0.5s;
            animation: pulseGlow 2s infinite;
        }

        /* FITUR BARU: Skeleton Loading Effect */
        .skeleton {
            background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%);
            background-size: 200% 100%;
            animation: shimmer 1.5s linear infinite;
            border-radius: 10px;
            color: transparent !important;
        }
        .skeleton-avatar { border-radius: 50%; border: none; background: #ececec; }

        /* Tipografi Premium */
        .welcome-sub {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .moving-name {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 2.2rem;
            line-height: 1.1;
            margin-bottom: 1.2rem;
            background: linear-gradient(to right, #ff4d6d, #ff758c, #4f46e5, #ff758c, #ff4d6d);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 3s linear infinite, pulseSlow 2s ease-in-out infinite;
            display: inline-block;
            min-width: 150px;
            min-height: 40px;
        }

        /* Tombol Logout */
        .btn-shine { 
            background: linear-gradient(135deg, #ff4d6d, #ff8fa3); 
            position: relative; 
            overflow: hidden; 
        }

        .btn-shine::after { 
            content: ""; 
            position: absolute; 
            top: 0; 
            left: -100%; 
            width: 50%; 
            height: 100%; 
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent); 
            transform: skewX(-25deg); 
            animation: buttonShine 4s infinite; 
        }

        .typing-cursor::after {
            content: '|';
            animation: blink 1s step-end infinite;
        }

        /* Navbar Bawah Modern */
        .nav-bottom {
            width: 100%;
            max-width: 380px;
            height: 70px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 0 10px;
            border: 1px solid rgba(255, 255, 255, 1);
            margin-bottom: 60px;
        }

        .nav-item {
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 12px;
            cursor: pointer;
        }

        .nav-icon { width: 24px; height: 24px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.05)); }
        .nav-item:hover { transform: scale(1.3) translateY(-8px); }

        /* Keyframes */
        @keyframes textShine { to { background-position: 200% center; } }
        @keyframes buttonShine { 0%, 20% { left: -100%; } 80%, 100% { left: 150%; } }
        @keyframes pulseSlow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        @keyframes gradientRotate { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        @keyframes shimmer { to { background-position-x: -200%; } }

        .loading-spin { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <img src="p1.png" class="full-bg" alt="Background">
    <div class="overlay"></div>

    <audio id="uiClick" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>

    <div class="app-layout">
        <div id="login-notif" class="animate__animated">
            <img src="https://cdn-icons-png.flaticon.com/512/7871/7871500.png" class="stiker-bear" alt="Icon">
            <div class="notif-text text-sm text-slate-800 font-bold">
                Akses Ditolak! <br><span class="font-normal text-slate-500">Silahkan login terlebih dahulu...</span>
            </div>
        </div>

        <main id="glassCard" class="glass-card-premium animate__animated animate__zoomIn">
            <div class="avatar-container skeleton skeleton-avatar" id="avatarWrap">
                <img id="userAvatar" src="https://cdn-icons-png.flaticon.com/512/1144/1144760.png" class="avatar-img opacity-0" alt="User Avatar">
                <div class="status-glow" id="statusGlow"></div>
            </div>

            <p class="welcome-sub skeleton" id="lblMember">Authorized Member</p>
            <h1 class="moving-name skeleton" id="displayName">Loading...</h1>

            <p id="typingText" class="text-slate-500 text-xs font-semibold leading-relaxed px-6 mb-4 min-h-[40px] skeleton"></p>

            <button id="btnLogout" class="btn-shine w-[85%] mx-auto py-3 rounded-2xl text-white font-black text-xs tracking-[0.2em] uppercase flex items-center justify-center gap-3 shadow-lg transition-all duration-300">
                <span id="btnText">LOG OUT</span>
                <div id="loader" class="loading-spin hidden"></div>
            </button>
        </main>

        <nav class="nav-bottom animate__animated animate__fadeInUp">
            <a href="dashboard.html" class="nav-item click-sfx"><img src="https://cdn-icons-png.flaticon.com/512/7648/7648203.png" class="nav-icon" alt="Home"></a>
            <a href="cari.html" class="nav-item click-sfx"><img src="https://cdn-icons-png.flaticon.com/512/954/954591.png" class="nav-icon" alt="Search"></a>
            <a href="pesan.html" class="nav-item click-sfx"><img src="https://cdn-icons-png.flaticon.com/512/668/668287.png" class="nav-icon" alt="Message"></a>
            <a href="game.html" class="nav-item click-sfx"><img src="https://cdn-icons-png.flaticon.com/512/808/808476.png" class="nav-icon" alt="Game"></a>
            <a href="helpdesk.html" class="nav-item click-sfx"><img src="https://cdn-icons-png.flaticon.com/512/8662/8662591.png" class="nav-icon" alt="Help"></a>
            <a href="profil.html" class="nav-item click-sfx"><img src="https://cdn-icons-png.flaticon.com/512/9187/9187604.png" class="nav-icon" alt="Profile"></a>
        </nav>
    </div>

    <script>
        (function() {
            const getStorage = (key) => {
                const val = localStorage.getItem(key);
                return (val === "undefined" || val === "null" || !val) ? null : val;
            };

            const secretName = getStorage('userSecretName');
            const avatarUrl = getStorage('userAvatar');
            const notif = document.getElementById('login-notif');

            // 1. Cek Autentikasi
            if (!secretName) {
                window.onload = () => {
                    notif.style.visibility = 'visible';
                    notif.classList.add('animate__fadeInDown');
                    setTimeout(() => {
                        notif.classList.replace('animate__fadeInDown', 'animate__fadeOutUp');
                        setTimeout(() => window.location.href = 'index.html', 800);
                    }, 3500);
                };
                return;
            }

            // 2. Fungsi Utama saat DOM Ready
            document.addEventListener("DOMContentLoaded", () => {
                
                // FITUR BARU: Sound Effect Click
                const clickSfx = document.getElementById('uiClick');
                document.querySelectorAll('.click-sfx, #btnLogout').forEach(btn => {
                    btn.addEventListener('click', () => {
                        clickSfx.currentTime = 0;
                        clickSfx.play().catch(e => console.log('Sfx prevented'));
                    });
                });

                // Simulasi Skeleton Loading & Render Data
                setTimeout(() => {
                    // Hapus skeleton class
                    document.getElementById('avatarWrap').classList.remove('skeleton', 'skeleton-avatar');
                    document.getElementById('lblMember').classList.remove('skeleton');
                    document.getElementById('displayName').classList.remove('skeleton');
                    
                    const typingElement = document.getElementById('typingText');
                    typingElement.classList.remove('skeleton');
                    typingElement.classList.add('typing-cursor');

                    // Tampilkan Data Sebenarnya
                    document.getElementById('displayName').innerText = secretName;
                    const avatarImg = document.getElementById('userAvatar');
                    if (avatarUrl) avatarImg.src = avatarUrl;
                    avatarImg.classList.remove('opacity-0');

                    // FITUR BARU: Tampilkan Status Glow
                    document.getElementById('statusGlow').style.opacity = '1';

                    // FITUR BARU: Dynamic Greeting berdasarkan Jam
                    const hour = new Date().getHours();
                    let greeting = "Selamat datang kembali";
                    let emoji = "👋";
                    
                    if (hour >= 5 && hour < 12) { 
                        greeting = "Good Morning, Sunshines!"; emoji = "☀️"; 
                    } else if (hour >= 12 && hour < 18) { 
                        greeting = "Have a Productive Day!"; emoji = "☕"; 
                    } else { 
                        greeting = "Time to Relax, Zee."; emoji = "🌙"; 
                    }

                    // Teks untuk diketik
                    const textToType = `${greeting} ${emoji} Semua sistem berjalan normal.`;
                    let i = 0;

                    function typeWriter() {
                        if (i < textToType.length) {
                            typingElement.innerHTML += textToType.charAt(i);
                            i++;
                            setTimeout(typeWriter, 40);
                        } else {
                            typingElement.classList.remove('typing-cursor');
                        }
                    }
                    setTimeout(typeWriter, 300); // Mulai typing setelah data muncul

                }, 1500); // Waktu fake loading 1.5 detik
            });

            // FITUR BARU: Parallax 3D Tilt Effect
            const card = document.getElementById('glassCard');
            document.addEventListener('mousemove', (e) => {
                // Menghitung posisi kursor untuk memiringkan card
                let xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                let yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
            // Reset saat kursor keluar layar
            document.addEventListener('mouseleave', () => {
                card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            });

            // 3. Fungsi Log Out Mengembang
            document.getElementById('btnLogout').addEventListener('click', function() {
                const btnText = document.getElementById('btnText');
                const loader = document.getElementById('loader');
                
                this.classList.remove('w-[85%]', 'mx-auto');
                this.classList.add('w-full');
                
                btnText.innerText = "EXITING...";
                loader.classList.remove('hidden');
                this.style.opacity = "0.8";
                this.disabled = true;

                localStorage.clear();
                
                setTimeout(() => {
                    window.location.href = 'index-login.html';
                }, 1200);
            });

            // 4. Proteksi Klik Kanan & Inspect
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J'))) e.preventDefault();
            });

        })();
    </script>
</body>

</html>
