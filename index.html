<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Zee App</title>
    <link rel="icon" type="image/png" href="p3.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            user-select: none;
            touch-action: manipulation;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        button { -webkit-tap-highlight-color: transparent; }

        .full-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            object-fit: cover;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top, rgba(255,255,255,0.1), rgba(0,0,0,0.6));
            z-index: -1;
        }

        .font-love { 
            font-family: 'Playfair Display', serif;
            letter-spacing: 1px;
        }

        .glass-card {
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255,255,255,0.2);
            width: 90%;
            max-width: 380px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 3rem 2rem;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: cardAppear 0.8s ease-out forwards;
        }

        @keyframes cardAppear { to { opacity: 1; transform: translateY(0); } }

        .reveal {
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.6s ease forwards;
        }

        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.5s; }
        .delay-3 { animation-delay: 0.7s; }
        .delay-4 { animation-delay: 0.9s; }

        .static-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            position: relative;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.3));
            animation: pulseGlow 3s ease-in-out infinite;
            transition: all 0.4s ease;
        }

        .static-logo:active {
            transform: scale(1.12);
            filter: drop-shadow(0 0 12px rgba(255, 105, 180, 0.8)) drop-shadow(0 0 25px rgba(255, 182, 193, 0.6));
        }

        .static-logo::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.7), transparent 60%);
            opacity: 0;
            animation: logoShineSoft 2.5s infinite;
            pointer-events: none;
        }

        @keyframes logoShineSoft {
            0% { opacity: 0; transform: scale(0.8); }
            40% { opacity: 0.6; }
            100% { opacity: 0; transform: scale(1.4); }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        .btn-shine {
            background: linear-gradient(135deg, #ff4d6d, #ff8fa3, #ffc2d1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.5);
        }

        .btn-shine::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.5), transparent);
            transform: skewX(-25deg);
            animation: shine 4s infinite;
        }

        @keyframes shine {
            0%, 20% { left: -100%; }
            80%, 100% { left: 150%; }
        }

        .btn-interact { transition: all 0.3s ease; }
        .btn-interact:hover { transform: scale(1.04); filter: brightness(1.1); }
        .btn-interact:active { transform: scale(0.97); }

        .btn-icon {
            width: 22px;
            height: 22px;
            margin-left: 10px;
            stroke-width: 2.5;
        }

        .credit-text {
            position: absolute;
            bottom: 15px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 800;
        }

        #infoModal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease;
        }

        .modal-content {
            background: rgba(255,255,255,0.95);
            padding: 2.5rem;
            border-radius: 35px;
            max-width: 320px;
            text-align: center;
            animation: modalIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* ANIMASI MENGEMBANG TOMBOL */
        .btn-expand {
            animation: expandPulse 2s infinite;
            transition: transform 0.2s ease;
        }

        @keyframes expandPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(17, 24, 39, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px 10px rgba(17, 24, 39, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(17, 24, 39, 0); }
        }

        .btn-expand:active {
            transform: scale(0.95);
        }

        @keyframes modalIn {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center">

    <div id="infoModal">
        <div class="modal-content">
            <img src="https://cdn-icons-png.flaticon.com/512/7603/7603406.png" class="w-20 h-20 mx-auto mb-6">
            <h2 class="text-2xl font-extrabold text-gray-800 mb-2">Zee App</h2>
            <p class="text-gray-600 text-sm mb-6">Cari pasangan anda di Zee App. Privasi 100%.</p>
            <button onclick="closeModal()" class="btn-expand w-full py-4 bg-gray-900 text-white rounded-2xl font-bold tracking-widest">
                MENGERTI
            </button>
        </div>
    </div>

    <img src="p1.png" class="full-bg" alt="Background">
    <div class="overlay"></div>

    <div class="glass-card">
        <div class="reveal delay-1 mb-6 flex justify-center">
            <img src="p2.png" class="static-logo" alt="Logo">
        </div>

        <h1 class="text-5xl font-love text-white mb-2 reveal delay-2">Zee App</h1>
        <p class="text-white/80 font-bold mb-10 text-[10px] tracking-[0.3em] uppercase reveal delay-2">Love Is Love</p>

        <div class="flex flex-col gap-5">
            <a href="index-login.html" class="reveal delay-3">
                <button class="btn-shine btn-interact w-full py-4 rounded-2xl text-white font-black text-xl flex items-center justify-center">
                    LOGIN <i data-lucide="log-in" class="btn-icon"></i>
                </button>
            </a>

            <a href="index-create-akun.html" class="reveal delay-4">
                <button class="btn-interact w-full py-4 rounded-2xl border-2 border-white/40 bg-white/10 text-white font-extrabold flex items-center justify-center">
                    CREATE ACCOUNT <i data-lucide="user-plus" class="btn-icon"></i>
                </button>
            </a>
        </div>
    </div>

    <div class="credit-text">Copyright © 2026 ZEE APP</div>

    <script>
        function closeModal() {
            const modal = document.getElementById('infoModal');
            modal.style.opacity = '0';
            setTimeout(() => modal.style.display = 'none', 400);
        }

        lucide.createIcons();

        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'F12') e.preventDefault();
            if (
                (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') ||
                (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') ||
                (e.ctrlKey && e.key.toLowerCase() === 'u')
            ) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
