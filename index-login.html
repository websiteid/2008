<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zee App | Login</title>
    <link rel="icon" type="image/png" href="p3.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0; padding: 0; min-height: 100vh; width: 100%;
            font-family: 'Inter', sans-serif;
            user-select: none;
            overflow-x: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .full-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; object-fit: cover; }
        
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.6)); 
            z-index: -1; 
        }

        .font-love { font-family: 'Playfair Display', serif; letter-spacing: 1px; }

        .content-wrapper { 
            position: relative; z-index: 10; min-height: 100vh; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 40px 20px; 
        }

        /* CARD PUTIH IDENTIK */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 1);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 400px;
            padding: 3rem 2rem;
            animation: cardAppear 0.8s ease-out forwards;
        }

        @keyframes cardAppear { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .input-error { border: 2px solid #ff4d6d !important; background: rgba(255, 77, 109, 0.05) !important; }
        
        /* INPUT STYLE IDENTIK */
        input { 
            background: #f8fafc !important; 
            border: 1px solid #e2e8f0 !important;
            color: #1e293b !important;
            transition: all 0.3s ease;
        }
        input::placeholder { color: #94a3b8; }
        input:focus { 
            border-color: #ff4d6d !important; 
            background: #ffffff !important;
            outline: none; 
            box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.1); 
        }

        /* Toast Notif IDENTIK */
        #customToast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; border-radius: 30px; 
            color: #1e293b; font-weight: 700; z-index: 1000; transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex; align-items: center; gap: 12px; min-width: 280px;
            background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
        }
        #customToast.show { top: 30px; }

        .btn-shine { background: linear-gradient(135deg, #ff4d6d, #ff8fa3); position: relative; overflow: hidden; }
        .btn-shine::after { content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent); transform: skewX(-25deg); animation: shine 4s infinite; }
        @keyframes shine { 0%, 20% { left: -100%; } 80%, 100% { left: 150%; } }

        .loading-spin { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <img src="p1.png" class="full-bg" alt="Background">
    <div class="overlay"></div>

    <div id="customToast">
        <div id="toastIconContainer" class="w-8 h-8 flex-shrink-0 flex items-center justify-center">
            <img id="toastImgIcon" src="" class="w-full h-full object-contain">
        </div>
        <span id="toastMsg" class="text-sm"></span>
    </div>

    <div class="content-wrapper">
        <div class="glass-card">
            <img src="p2.png" alt="Logo" class="w-24 h-24 mx-auto mb-4 object-contain animate__animated animate__pulse animate__infinite">
            <h1 class="text-4xl font-love text-slate-800 text-center mb-1">Zee App</h1>
            <p class="text-slate-400 font-bold mb-8 text-[9px] tracking-[0.4em] uppercase text-center">Silahkan Masukan Username & Password !</p>

            <form id="loginForm" class="space-y-4">
                <div id="group-username">
                    <label class="text-[10px] font-black ml-1 uppercase tracking-[0.2em] text-slate-500">Username</label>
                    <input type="text" id="username" placeholder="Masukkan username" class="w-full py-3 px-5 rounded-2xl mt-1 text-sm font-semibold">
                </div>

                <div class="relative" id="group-password">
                    <label class="text-[10px] font-black ml-1 uppercase tracking-[0.2em] text-slate-500">Password</label>
                    <input type="password" id="password" placeholder="••••••••" class="w-full py-3 px-5 rounded-2xl mt-1 text-sm font-semibold">
                    <button type="button" onclick="togglePass()" class="absolute right-4 top-9 text-lg opacity-40 hover:opacity-80">
                        <span id="eyeIcon">👁️</span>
                    </button>
                </div>

                <div class="text-right pr-1">
                    <a href="index-password.html" class="text-[9px] font-black uppercase tracking-[0.1em] text-slate-400 hover:text-pink-500 transition-all">Lupa Password?</a>
                </div>

                <button type="submit" id="btnSubmit" class="btn-shine w-full py-4 mt-2 rounded-2xl text-white font-black text-sm tracking-[0.2em] uppercase flex items-center justify-center gap-3 active:scale-95 shadow-lg transition-all">
                    <span id="btnText">LOG IN NOW 🚀</span>
                    <div id="loader" class="loading-spin hidden"></div>
                </button>
            </form>

            <div class="text-center space-y-4">
                <div class="mt-8">
                    <p class="text-[9px] font-black text-slate-400 uppercase tracking-[0.1em]">Belum punya akun?</p>
                    <a href="index-create-akun.html" class="text-[10px] font-black text-pink-500 uppercase tracking-[0.2em] hover:underline">Daftar Sekarang ✨</a>
                </div>
                
                <a href="index.html" class="inline-block text-slate-300 text-[9px] font-black uppercase tracking-[0.3em] hover:text-slate-500 transition-all">
                    ← Back to Gateway
                </a>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzJFMjybKec38LtO6oimV0Q82MZ8sN9vZ429KevNL8sJMvgSVsJoXIJ1g3vrThjXyLh/exec';

        function showToast(msg, type = 'error') {
            const toast = document.getElementById('customToast');
            const iconImg = document.getElementById('toastImgIcon');
            const text = document.getElementById('toastMsg');
            text.innerText = msg;
            iconImg.classList.add('animate__animated', 'animate__bounceIn');

            if(type === 'error') {
                iconImg.src = "https://cdn-icons-png.flaticon.com/512/8044/8044598.png";
                toast.style.borderColor = '#fee2e2';
            } else {
                iconImg.src = "https://cdn-icons-png.flaticon.com/512/6808/6808197.png";
                toast.style.borderColor = '#d1fae5';
            }

            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                iconImg.classList.remove('animate__animated', 'animate__bounceIn');
            }, 3000);
        }

        function togglePass() {
            const passInput = document.getElementById('password');
            const eye = document.getElementById('eyeIcon');
            passInput.type = passInput.type === "password" ? "text" : "password";
            eye.innerText = passInput.type === "password" ? "👁️" : "🔒";
        }

        function shakeField(groupId) {
            const el = document.getElementById(groupId);
            el.classList.add('animate__animated', 'animate__headShake');
            const input = el.querySelector('input');
            if(input) input.classList.add('input-error');
            setTimeout(() => el.classList.remove('animate__animated', 'animate__headShake'), 500);
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            document.querySelectorAll('input').forEach(el => el.classList.remove('input-error'));

            let isValid = true;
            if (!username) { shakeField('group-username'); isValid = false; }
            if (!password) { shakeField('group-password'); isValid = false; }
            
            if (!isValid) {
                showToast("Isi username & password!");
                return;
            }

            const btn = document.getElementById('btnSubmit');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');

            btn.disabled = true;
            btnText.innerText = "LOGIN....";
            loader.classList.remove('hidden');

            try {
                // Menggunakan URLSearchParams agar sesuai dengan doPost di Apps Script
                const formData = new URLSearchParams();
                formData.append('action', 'login');
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();

                if (result.status === 'success') {
                    showToast('Login Berhasil! Selamat Datang', 'success');
                    // Simpan session
                    localStorage.setItem('userSecretName', result.secretName);
                    localStorage.setItem('userAvatar', result.avatar);
                    localStorage.setItem('userUsername', result.username);
                    
                    setTimeout(() => window.location.href = 'dashboard.html', 2000);
                } else {
                    showToast(result.message || "Akses Ditolak!", 'error');
                    shakeField('group-username');
                    shakeField('group-password');
                    btn.disabled = false;
                    btnText.innerText = "LOG IN NOW 🚀";
                    loader.classList.add('hidden');
                }
            } catch (error) {
                showToast("Gagal terhubung ke server!");
                btn.disabled = false;
                btnText.innerText = "LOG IN NOW 🚀";
                loader.classList.add('hidden');
            }
        });

        // Proteksi IDENTIK
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J'))) e.preventDefault();
        });
    </script>
</body>
</html>
