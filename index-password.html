<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zee App | Reset Password</title>
    <link rel="icon" type="image/png" href="p3.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0; padding: 0; min-height: 100vh; width: 100%;
            font-family: 'Inter', sans-serif;
            user-select: none; overflow-x: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .full-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; object-fit: cover; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.7)); z-index: -1; }
        .font-love { font-family: 'Playfair Display', serif; }

        .content-wrapper { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid white;
            border-radius: 35px;
            width: 100%;
            max-width: 400px;
            padding: 2rem 1.5rem;
            display: flex; flex-direction: column; height: 80vh; max-height: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .chat-container {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 10px 5px; margin-bottom: 15px;
        }
        .chat-container::-webkit-scrollbar { width: 3px; }
        .chat-container::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        .chat-bubble { max-width: 80%; padding: 12px 16px; font-size: 0.85rem; line-height: 1.5; animation: fadeInUp 0.4s ease forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .chat-bot { background: #f1f5f9; color: #334155; border-radius: 20px 20px 20px 5px; align-self: flex-start; font-weight: 500; border: 1px solid #e2e8f0; }
        .chat-user { background: #ff4d6d; color: white; border-radius: 20px 20px 5px 20px; align-self: flex-end; font-weight: 600; }

        .typing { display: flex; gap: 4px; padding: 10px 15px; background: #f1f5f9; border-radius: 20px; width: fit-content; align-self: flex-start; margin-bottom: 10px; }
        .dot { width: 6px; height: 6px; background: #cbd5e1; border-radius: 50%; animation: blink 1.4s infinite both; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

        .input-box { display: flex; gap: 8px; background: #f8fafc; padding: 6px; border-radius: 25px; border: 1px solid #e2e8f0; }
        .input-box input { flex: 1; background: transparent; border: none; outline: none; padding: 8px 15px; font-size: 0.9rem; font-weight: 600; color: #1e293b; }
        .btn-send { background: #ff4d6d; color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-send:active { transform: scale(0.9); }
    </style>
</head>
<body oncontextmenu="return false;">

    <img src="p1.png" class="full-bg" alt="Background">
    <div class="overlay"></div>

    <div class="content-wrapper">
        <div class="glass-card">
            
            <div class="text-center border-b border-slate-100 pb-4 mb-2">
                <div class="w-16 h-16 bg-white rounded-full mx-auto flex items-center justify-center mb-2 shadow-sm overflow-hidden border border-slate-100">
                    <img src="https://cdn-icons-png.flaticon.com/512/2814/2814666.png" alt="AI Icon" class="w-10 h-10">
                </div>
                <h1 class="text-xl font-love font-bold text-slate-800">Zee Assistant</h1>
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Automatic Recovery Tool</p>
            </div>

            <div class="chat-container" id="chatBox"></div>

            <div class="input-box">
                <input type="text" id="userInput" placeholder="Tulis username..." autocomplete="off">
                <button id="sendBtn" class="btn-send shadow-lg">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>

            <div class="text-center mt-4">
                <a href="index-login.html" class="text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-pink-500 transition-all">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzJFMjybKec38LtO6oimV0Q82MZ8sN9vZ429KevNL8sJMvgSVsJoXIJ1g3vrThjXyLh/exec';
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Proteksi 100% (Anti Klik Kanan & Inspect)
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || 
                (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) || 
                (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) || 
                (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) || 
                (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                return false;
            }
        };

        function addMsg(text, type) {
            const div = document.createElement('div');
            div.className = `chat-bubble ${type === 'bot' ? 'chat-bot' : 'chat-user'}`;
            div.innerHTML = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing';
            div.id = 'typingAnim';
            div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        window.onload = () => {
            setTimeout(() => addMsg("Halo! 👋 Saya bot pemulihan Zee App.", "bot"), 500);
            setTimeout(() => addMsg("Bisa sebutkan <b>Username</b> akunmu yang ingin dipulihkan?", "bot"), 1200);
        };

        async function processRecovery() {
            const userText = userInput.value.trim();
            if (!userText) return;

            addMsg(userText, "user");
            userInput.value = '';
            userInput.disabled = true;
            
            setTimeout(showTyping, 400);

            try {
                const formData = new URLSearchParams();
                formData.append('action', 'recoverPassword'); 
                formData.append('username', userText.toLowerCase());

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if(document.getElementById('typingAnim')) document.getElementById('typingAnim').remove();

                if (result.status === 'success') {
                    addMsg(`🔍 Username <b>${userText}</b> ditemukan!`, "bot");
                    setTimeout(() => {
                        addMsg(`Password kamu adalah: <br><b class="text-pink-600 text-lg tracking-wider">${result.password}</b>`, "bot");
                        addMsg("Gunakan password ini untuk login kembali ya! ✨", "bot");
                        userInput.disabled = false;
                        userInput.focus();
                    }, 800);
                } else {
                    addMsg(`❌ Maaf, username <b>${userText}</b> tidak ada dalam database kami.`, "bot");
                    userInput.disabled = false;
                    userInput.focus();
                }
            } catch (error) {
                if(document.getElementById('typingAnim')) document.getElementById('typingAnim').remove();
                addMsg("⚠️ Terjadi kesalahan koneksi ke server. Coba lagi nanti.", "bot");
                userInput.disabled = false;
            }
        }

        sendBtn.onclick = processRecovery;
        userInput.onkeypress = (e) => { if(e.key === 'Enter') processRecovery(); };
    </script>
</body>
</html>
